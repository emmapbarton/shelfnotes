<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Learning Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --paper: #f5f0e8;
    --cream: #ede8d8;
    --warm-white: #faf7f2;
    --sienna: #8b3a1a;
    --rust: #c0522a;
    --gold: #c9973a;
    --sage: #4a6741;
    --slate: #3d4f5c;
    --muted: #7a6f63;
    --border: #d4c9b4;
    --shadow: rgba(26,20,16,0.1);
    --card-bg: #fff9f3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 0%, rgba(201,151,58,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(139,58,26,0.05) 0%, transparent 60%);
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 0 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .logo span { color: var(--gold); }
  .header-actions { display: flex; gap: 0.6rem; align-items: center; }

  /* ── NAV ── */
  nav {
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    padding: 0 2.5rem;
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  .nav-btn {
    padding: 0.85rem 1.3rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-btn:hover { color: var(--ink); }
  .nav-btn.active { color: var(--sienna); border-bottom-color: var(--sienna); }

  /* ── MAIN ── */
  main { padding: 2rem 2.5rem; max-width: 1400px; margin: 0 auto; }

  /* ── SECTION TITLES ── */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--ink);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
  }
  .section-title small {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── DASHBOARD ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2.5rem;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem 1.4rem;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--sienna);
  }
  .stat-card.gold::before { background: var(--gold); }
  .stat-card.sage::before { background: var(--sage); }
  .stat-card.slate::before { background: var(--slate); }
  .stat-label {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--ink);
    line-height: 1;
  }
  .stat-sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
  @media(max-width: 700px){ .dash-row { grid-template-columns: 1fr; } }

  .dash-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.4rem;
  }
  .dash-panel h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    margin-bottom: 1rem;
    color: var(--ink);
  }
  .concept-tag {
    display: inline-block;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.25rem 0.6rem;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    color: var(--slate);
    margin: 0.2rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .concept-tag:hover { background: var(--border); }

  .alert-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .alert-item:last-child { border-bottom: none; }
  .alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); flex-shrink: 0; }

  /* ── BOOK GRID ── */
  .books-toolbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .filter-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; flex: 1; }
  .chip {
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover, .chip.active { background: var(--sienna); border-color: var(--sienna); color: #fff; }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.4rem;
  }

  .book-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .book-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px var(--shadow); }

  .book-card-cover {
    height: 180px;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .book-card-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .book-cover-placeholder {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-style: italic;
    color: var(--muted);
    text-align: center;
    padding: 1rem;
    line-height: 1.4;
  }
  .status-badge {
    position: absolute;
    top: 0.7rem;
    right: 0.7rem;
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .status-reading { background: #d4edda; color: #2d6a4f; }
  .status-paused  { background: #fff3cd; color: #856404; }
  .status-finished{ background: #cfe2ff; color: #084298; }
  .status-not-started{ background: var(--cream); color: var(--muted); border: 1px solid var(--border); }

  .book-card-body { padding: 1rem 1.1rem 1.1rem; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
  .book-category {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sienna);
  }
  .book-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    line-height: 1.3;
    color: var(--ink);
  }
  .book-author { font-size: 0.8rem; color: var(--muted); }
  .progress-wrap { margin-top: auto; padding-top: 0.7rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.3rem; }
  .progress-bar-bg { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--sienna), var(--gold)); border-radius: 2px; transition: width 0.4s; }

  /* ── MODALS ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.55);
    backdrop-filter: blur(3px);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--warm-white);
    border-radius: 12px;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header {
    background: var(--ink);
    color: var(--paper);
    padding: 1.2rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; }
  .modal-body { padding: 1.5rem; }
  .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.6rem; justify-content: flex-end; }

  /* ── BOOK DETAIL ── */
  .book-detail-modal { max-width: 900px; }
  .book-detail-layout { display: grid; grid-template-columns: 200px 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  @media(max-width:600px){ .book-detail-layout { grid-template-columns: 1fr; } }
  .book-detail-cover {
    border-radius: 6px;
    overflow: hidden;
    background: var(--cream);
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
  }
  .book-detail-cover img { width: 100%; height: 100%; object-fit: cover; }
  .book-detail-meta h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 0.3rem; }
  .book-detail-meta .author { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }

  .meta-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .meta-pill {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
  }
  .meta-pill strong { font-weight: 600; }

  /* tabs inside book detail */
  .detail-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.2rem; }
  .detail-tab {
    padding: 0.6rem 1.1rem;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .detail-tab.active { color: var(--sienna); border-bottom-color: var(--sienna); }

  /* notes */
  .note-entry {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .note-header {
    background: var(--cream);
    padding: 0.6rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.82rem;
    font-weight: 500;
  }
  .note-date { font-family: 'DM Mono', monospace; color: var(--sienna); }
  .note-pages { color: var(--muted); }
  .note-body { padding: 0.8rem 1rem; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; }
  .note-tags { padding: 0 1rem 0.7rem; }

  /* support shelf */
  .support-shelf { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .support-book {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .support-book button { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 0.9rem; }

  /* ── FORMS ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media(max-width:500px){ .form-grid { grid-template-columns: 1fr; } }
  .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  input, select, textarea {
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    background: var(--card-bg);
    color: var(--ink);
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sienna); }
  textarea { resize: vertical; min-height: 90px; }

  /* ── BUTTONS ── */
  .btn {
    padding: 0.55rem 1.1rem;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--ink);
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .btn:hover { background: var(--cream); }
  .btn-primary { background: var(--sienna); color: #fff; border-color: var(--sienna); }
  .btn-primary:hover { background: var(--rust); border-color: var(--rust); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--cream); }
  .btn-icon { padding: 0.4rem 0.6rem; }
  .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; }
  .btn-danger { background: #dc3545; color: #fff; border-color: #dc3545; }

  /* ── CATEGORY VIEW ── */
  .cat-header {
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 1.5rem 2rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cat-header h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; }
  .cat-stats { display: flex; gap: 2rem; }
  .cat-stat { text-align: center; }
  .cat-stat-val { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); }
  .cat-stat-lab { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6); }

  /* empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .empty-state .big { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 0.5rem; opacity: 0.3; }
  .empty-state p { font-size: 0.9rem; margin-bottom: 1.2rem; }

  /* note form */
  .note-form { background: var(--cream); border-radius: 8px; padding: 1.2rem; margin-bottom: 1.2rem; border: 1px solid var(--border); }
  .note-form h4 { font-family: 'Playfair Display', serif; font-size: 0.95rem; margin-bottom: 0.9rem; }
  .tag-input-wrap { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; background: var(--card-bg); min-height: 40px; }
  .tag-input-wrap input { border: none; background: transparent; flex: 1; min-width: 100px; padding: 0; font-size: 0.85rem; }
  .tag-input-wrap input:focus { outline: none; border: none; }
  .inline-tag { background: var(--sienna); color: #fff; border-radius: 4px; padding: 0.15rem 0.45rem; font-size: 0.72rem; display: flex; align-items: center; gap: 0.25rem; }
  .inline-tag button { background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 0.75rem; padding: 0; }

  /* ── RICH EDITOR ── */
  .rich-editor-wrap { border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); overflow: hidden; }
  .rich-toolbar {
    display: flex;
    gap: 2px;
    padding: 0.4rem 0.5rem;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }
  .rich-toolbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }
  .tb-btn {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1px solid transparent; border-radius: 4px;
    cursor: pointer; font-size: 0.82rem; color: var(--ink);
    transition: all 0.15s; font-family: serif;
    padding: 0;
  }
  .tb-btn:hover { background: var(--border); }
  .tb-btn.active { background: var(--sienna); color: #fff; border-color: var(--sienna); }
  .tb-btn.highlight-btn { font-size: 0.75rem; }
  .rich-editor {
    min-height: 90px;
    padding: 0.6rem 0.8rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    line-height: 1.65;
    color: var(--ink);
    outline: none;
  }
  .rich-editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
  .rich-editor mark { background: #ffe066; color: inherit; border-radius: 2px; padding: 0 2px; }
  .rich-editor ul { padding-left: 1.4em; }
  .rich-editor ol { padding-left: 1.4em; }
  /* note body rendered */
  .note-body mark { background: #ffe066; color: inherit; border-radius: 2px; padding: 0 2px; }
  .note-body ul { padding-left: 1.4em; }
  .note-body ol { padding-left: 1.4em; }

  /* page input in-card */
  .page-input-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
  .page-input-row input { width: 70px; padding: 0.3rem 0.5rem; font-size: 0.85rem; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--cream); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .hidden { display: none !important; }
  .view { display: none; }
  .view.active { display: block; }

  /* category chips in categories panel */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .cat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 4px solid var(--sienna);
  }
  .cat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow); }
  .cat-card h3 { font-family: 'Playfair Display', serif; margin-bottom: 0.5rem; }
  .cat-card .cat-meta { font-size: 0.8rem; color: var(--muted); }

  /* IMPORT/EXPORT */
  .io-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; margin-top: 1rem; }
  .io-section h4 { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">📚 <span>Bibliotheca</span> Personalis</div>
  <div class="header-actions">
    <button class="btn btn-sm" id="exportBtn">↓ Export JSON</button>
    <label class="btn btn-sm" style="cursor:pointer;">↑ Import JSON<input type="file" accept=".json" id="importFile" class="hidden"></label>
    <button class="btn btn-sm btn-primary" id="addBookBtn">+ Add Book</button>
  </div>
</header>

<nav>
  <button class="nav-btn active" data-view="dashboard">Dashboard</button>
  <button class="nav-btn" data-view="library">Library</button>
  <button class="nav-btn" data-view="categories">Categories</button>
</nav>

<main>

  <!-- DASHBOARD -->
  <div class="view active" id="view-dashboard">
    <div class="section-title">Dashboard <small>your learning at a glance</small></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="dash-row">
      <div class="dash-panel">
        <h3>Currently Reading</h3>
        <div id="currentlyReading"></div>
      </div>
      <div class="dash-panel">
        <h3>⚠ Books Without Recent Notes</h3>
        <div id="staleBooks"></div>
      </div>
    </div>
    <div class="dash-row">
      <div class="dash-panel">
        <h3>Recent Concept Tags</h3>
        <div id="recentConcepts"></div>
      </div>
      <div class="dash-panel">
        <h3>Categories Covered</h3>
        <div id="categoryCoverage"></div>
      </div>
    </div>
  </div>

  <!-- LIBRARY -->
  <div class="view" id="view-library">
    <div class="section-title">Library <small id="bookCount"></small></div>
    <div class="books-toolbar">
      <div class="filter-chips" id="statusFilters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="Reading">Reading</button>

        <div class="rich-editor" id="note-questions" contenteditable="true" data-placeholder="How does LasR compare to RhlR?"></div>
        <div style="background:var(--cream);padding:0.3rem 0.8rem;font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border)">⚡ Actions / Follow-ups</div>

<!-- CAT DETAIL VIEW (inlined in categories panel) -->

<script>
// ─── STATE ───────────────────────────────────────────────
let state = { books: [] };
let currentBookId = null;
let editingBookId = null;
let pendingTags = [];
let activeDetailTab = 'notes';
let activeCatFilter = 'all';
let activeStatusFilter = 'all';

const CATEGORY_COLORS = ['#8b3a1a','#4a6741','#3d4f5c','#7b4fa3','#2a6d8f','#c07a2a','#5c3d6b','#2d6a4f'];

function catColor(cat) {
  let h = 0; for(let c of cat) h = (h * 31 + c.charCodeAt(0)) % CATEGORY_COLORS.length;
  return CATEGORY_COLORS[h];
}

// ─── PERSISTENCE ─────────────────────────────────────────
function save() { localStorage.setItem('pll_data', JSON.stringify(state)); }
function load() {
  const d = localStorage.getItem('pll_data');
  if(d) state = JSON.parse(d);
  if(!state.books) state.books = [];
}

// ─── UTILS ───────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today() { return new Date().toISOString().slice(0,10); }
function pct(cur,tot) { if(!tot) return 0; return Math.min(100, Math.round(cur/tot*100)); }
function statusClass(s) {
  return {Reading:'status-reading',Paused:'status-paused',Finished:'status-finished','Not Started':'status-not-started'}[s]||'status-not-started';
}
function weekAgo() { const d=new Date(); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10); }
function allConcepts() {
  const tags = [];
  state.books.forEach(b => (b.notes||[]).forEach(n => (n.tags||[]).forEach(t => tags.push(t))));
  return [...new Set(tags)];
}
function allCategories() { return [...new Set(state.books.map(b=>b.category).filter(Boolean))]; }

// ─── NAVIGATION ──────────────────────────────────────────
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='dashboard') renderDashboard();
    if(btn.dataset.view==='library') renderLibrary();
    if(btn.dataset.view==='categories') renderCategories();
  });
});

// ─── DASHBOARD ───────────────────────────────────────────
function renderDashboard() {
  const books = state.books;
  const wa = weekAgo();

  // stats
  const reading = books.filter(b=>b.status==='Reading').length;
  const notesThisWeek = books.reduce((acc,b)=>acc+(b.notes||[]).filter(n=>n.date>=wa).length,0);
  const pagesThisWeek = books.reduce((acc,b)=>acc+(b.notes||[]).filter(n=>n.date>=wa).reduce((s,n)=>{
    if(!n.pages) return s;
    const m = n.pages.match(/(\d+)[^\d]+(\d+)/);
    return m ? s+(+m[2]-+m[1]+1) : s;
  },0),0);
  const cats = allCategories().length;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Books</div><div class="stat-value">${books.length}</div></div>
    <div class="stat-card"><div class="stat-label">Reading Now</div><div class="stat-value">${reading}</div></div>
    <div class="stat-card gold"><div class="stat-label">Pages This Week</div><div class="stat-value">${pagesThisWeek}</div></div>
    <div class="stat-card sage"><div class="stat-label">Notes This Week</div><div class="stat-value">${notesThisWeek}</div></div>
    <div class="stat-card slate"><div class="stat-label">Categories</div><div class="stat-value">${cats}</div></div>
    <div class="stat-card"><div class="stat-label">Concepts Tagged</div><div class="stat-value">${allConcepts().length}</div></div>
  `;

  // currently reading
  const cr = books.filter(b=>b.status==='Reading');
  document.getElementById('currentlyReading').innerHTML = cr.length ? cr.map(b=>`
    <div class="alert-item" onclick="openBookDetail('${b.id}')" style="cursor:pointer">
      <div class="alert-dot" style="background:var(--sage)"></div>
      <div>
        <div style="font-weight:500;font-size:0.88rem">${b.title}</div>
        <div style="font-size:0.75rem;color:var(--muted)">${pct(b.currentPage,b.totalPages)}% · p.${b.currentPage||0} of ${b.totalPages||'?'}</div>
      </div>
    </div>`).join('') : '<p style="color:var(--muted);font-size:0.85rem">No books currently being read.</p>';

  // stale books (reading or paused, no notes in 7 days)
  const stale = books.filter(b=>['Reading','Paused'].includes(b.status)&&!(b.notes||[]).some(n=>n.date>=wa));
  document.getElementById('staleBooks').innerHTML = stale.length ? stale.map(b=>`
    <div class="alert-item" onclick="openBookDetail('${b.id}')" style="cursor:pointer">
      <div class="alert-dot"></div>
      <div>
        <div style="font-weight:500;font-size:0.88rem">${b.title}</div>
        <div style="font-size:0.75rem;color:var(--muted)">Last note: ${lastNoteDate(b)||'Never'}</div>
      </div>
    </div>`).join('') : '<p style="color:var(--muted);font-size:0.85rem">All up to date! 🎉</p>';

  // concepts
  const concepts = allConcepts().slice(-30);
  document.getElementById('recentConcepts').innerHTML = concepts.length
    ? concepts.map(t=>`<span class="concept-tag">${t}</span>`).join('')
    : '<p style="color:var(--muted);font-size:0.85rem">No concept tags yet.</p>';

  // category coverage
  const catData = allCategories();
  document.getElementById('categoryCoverage').innerHTML = catData.length
    ? catData.map(c=>{
        const cnt = books.filter(b=>b.category===c).length;
        return `<div class="alert-item">
          <div style="width:10px;height:10px;border-radius:2px;background:${catColor(c)};flex-shrink:0"></div>
          <span style="flex:1;font-size:0.85rem">${c}</span>
          <span style="font-size:0.78rem;color:var(--muted)">${cnt} book${cnt>1?'s':''}</span>
        </div>`;
      }).join('')
    : '<p style="color:var(--muted);font-size:0.85rem">No categories yet.</p>';
}

function lastNoteDate(b) {
  const notes = (b.notes||[]).sort((a,z)=>z.date.localeCompare(a.date));
  return notes[0]?.date || null;
}

// ─── LIBRARY ─────────────────────────────────────────────
function renderLibrary() {
  const search = (document.getElementById('searchInput').value||'').toLowerCase();
  let books = state.books.filter(b => {
    if(activeStatusFilter!=='all' && b.status!==activeStatusFilter) return false;
    if(search && !b.title.toLowerCase().includes(search) && !(b.author||'').toLowerCase().includes(search)) return false;
    return true;
  });
  document.getElementById('bookCount').textContent = `${books.length} book${books.length!==1?'s':''}`;
  const grid = document.getElementById('booksGrid');
  if(!books.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="big">📖</div>
      <p>No books found. Add your first book to get started.</p>
      <button class="btn btn-primary" onclick="openAddBook()">+ Add Book</button>
    </div>`;
    return;
  }
  grid.innerHTML = books.map(b => bookCardHTML(b)).join('');
  grid.querySelectorAll('.book-card').forEach(card => {
    card.addEventListener('click', () => openBookDetail(card.dataset.id));
  });
  // populate category datalist
  const dl = document.getElementById('catList');
  if(dl) dl.innerHTML = allCategories().map(c=>`<option value="${c}">`).join('');
  // update page live
  grid.querySelectorAll('.page-save-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const inp = document.getElementById('pi-'+id);
      const book = state.books.find(b=>b.id===id);
      if(book && inp) { book.currentPage = parseInt(inp.value)||0; save(); renderLibrary(); }
    });
  });
}

function bookCardHTML(b) {
  const p = pct(b.currentPage, b.totalPages);
  const coverHTML = b.coverUrl
    ? `<img src="${escHtml(b.coverUrl)}" alt="${escHtml(b.title)}" onerror="this.style.display='none'">`
    : `<div class="book-cover-placeholder">${escHtml(b.title)}</div>`;
  return `<div class="book-card" data-id="${b.id}">
    <div class="book-card-cover">
      ${coverHTML}
      <span class="status-badge ${statusClass(b.status)}">${b.status}</span>
    </div>
    <div class="book-card-body">
      <div class="book-category" style="color:${catColor(b.category||'')}">${escHtml(b.category||'Uncategorised')}</div>
      <div class="book-title">${escHtml(b.title)}</div>
      <div class="book-author">${escHtml(b.author||'')}</div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>p.${b.currentPage||0} / ${b.totalPages||'?'}</span>
          <span>${p}%</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${p}%"></div></div>
        <div class="page-input-row" onclick="event.stopPropagation()">
          <input type="number" id="pi-${b.id}" value="${b.currentPage||0}" min="0" max="${b.totalPages||9999}" style="width:70px;padding:0.28rem 0.4rem;font-size:0.8rem">
          <button class="btn btn-sm page-save-btn" data-id="${b.id}">Update page</button>
        </div>
      </div>
    </div>
  </div>`;
}

document.getElementById('searchInput').addEventListener('input', renderLibrary);
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    activeStatusFilter = c.dataset.filter;
    renderLibrary();
  });
});

// ─── CATEGORIES ──────────────────────────────────────────
let selectedCat = null;

function renderCategories() {
  const cats = allCategories();
  const cont = document.getElementById('catContent');
  if(selectedCat) {
    renderCatDetail(selectedCat);
    return;
  }
  if(!cats.length) {
    cont.innerHTML = `<div class="empty-state"><div class="big">🗂</div><p>No categories yet. Add books with a category to get started.</p></div>`;
    return;
  }
  cont.innerHTML = `<div class="cat-grid">${cats.map(c=>{
    const books = state.books.filter(b=>b.category===c);
    const notes = books.reduce((s,b)=>s+(b.notes||[]).length,0);
    const pages = books.reduce((s,b)=>s+(+b.totalPages||0),0);
    return `<div class="cat-card" onclick="drillCat('${escAttr(c)}')" style="border-left-color:${catColor(c)}">
      <h3>${escHtml(c)}</h3>
      <div class="cat-meta">${books.length} books · ${notes} notes · ${pages} pages</div>
    </div>`;
  }).join('')}</div>`;
}

function drillCat(c) {
  selectedCat = c;
  renderCatDetail(c);
}

function renderCatDetail(c) {
  const books = state.books.filter(b=>b.category===c);
  const notes = books.reduce((s,b)=>s+(b.notes||[]).length,0);
  const pages = books.reduce((s,b)=>s+(+b.totalPages||0),0);
  const cont = document.getElementById('catContent');
  cont.innerHTML = `
    <button class="btn btn-ghost" onclick="selectedCat=null;renderCategories()" style="margin-bottom:1rem">← All Categories</button>
    <div class="cat-header">
      <h2>${escHtml(c)}</h2>
      <div class="cat-stats">
        <div class="cat-stat"><div class="cat-stat-val">${books.length}</div><div class="cat-stat-lab">Books</div></div>
        <div class="cat-stat"><div class="cat-stat-val">${notes}</div><div class="cat-stat-lab">Notes</div></div>
        <div class="cat-stat"><div class="cat-stat-val">${pages}</div><div class="cat-stat-lab">Pages</div></div>
      </div>
    </div>
    <div class="books-grid">${books.map(b=>bookCardHTML(b)).join('')}</div>
  `;
  cont.querySelectorAll('.book-card').forEach(card => {
    card.addEventListener('click', () => openBookDetail(card.dataset.id));
  });
  cont.querySelectorAll('.page-save-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const inp = document.getElementById('pi-'+id);
      const book = state.books.find(b=>b.id===id);
      if(book && inp) { book.currentPage = parseInt(inp.value)||0; save(); renderCatDetail(c); }
    });
  });
}

// ─── ADD / EDIT BOOK ─────────────────────────────────────
function openAddBook() {
  editingBookId = null;
  document.getElementById('bookFormTitle').textContent = 'Add New Book';
  document.getElementById('deleteBookBtn').classList.add('hidden');
  ['bf-title','bf-author','bf-category','bf-cover'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('bf-total').value='';
  document.getElementById('bf-current').value='0';
  document.getElementById('bf-status').value='Not Started';
  openModal('bookFormModal');
}

function editCurrentBook() {
  const book = state.books.find(b=>b.id===currentBookId);
  if(!book) return;
  closeModal('bookDetailModal');
  editingBookId = book.id;
  document.getElementById('bookFormTitle').textContent = 'Edit Book';
  document.getElementById('deleteBookBtn').classList.remove('hidden');
  document.getElementById('bf-title').value = book.title||'';
  document.getElementById('bf-author').value = book.author||'';
  document.getElementById('bf-category').value = book.category||'';
  document.getElementById('bf-total').value = book.totalPages||'';
  document.getElementById('bf-current').value = book.currentPage||0;
  document.getElementById('bf-status').value = book.status||'Not Started';
  document.getElementById('bf-cover').value = book.coverUrl||'';
  openModal('bookFormModal');
}

function saveBook() {
  const title = document.getElementById('bf-title').value.trim();
  if(!title) { alert('Title is required.'); return; }
  const data = {
    title,
    author: document.getElementById('bf-author').value.trim(),
    category: document.getElementById('bf-category').value.trim(),
    totalPages: parseInt(document.getElementById('bf-total').value)||0,
    currentPage: parseInt(document.getElementById('bf-current').value)||0,
    status: document.getElementById('bf-status').value,
    coverUrl: document.getElementById('bf-cover').value.trim(),
  };
  if(editingBookId) {
    const idx = state.books.findIndex(b=>b.id===editingBookId);
    if(idx>-1) Object.assign(state.books[idx], data);
  } else {
    state.books.push({ id: uid(), notes: [], supports: [], ...data });
  }
  save();
  closeModal('bookFormModal');
  renderLibrary();
  renderDashboard();
}

function deleteBook() {
  if(!editingBookId) return;
  if(!confirm('Delete this book and all its notes?')) return;
  state.books = state.books.filter(b=>b.id!==editingBookId);
  save();
  closeModal('bookFormModal');
  renderLibrary();
  renderDashboard();
}

document.getElementById('addBookBtn').addEventListener('click', openAddBook);

// ─── BOOK DETAIL ─────────────────────────────────────────
function openBookDetail(id) {
  currentBookId = id;
  activeDetailTab = 'notes';
  renderBookDetail();
  openModal('bookDetailModal');
}

function renderBookDetail() {
  const book = state.books.find(b=>b.id===currentBookId);
  if(!book) return;
  document.getElementById('detailTitle').textContent = book.title;
  const p = pct(book.currentPage, book.totalPages);
  const coverHTML = book.coverUrl
    ? `<img src="${escHtml(book.coverUrl)}" alt="" onerror="this.style.display='none'">`
    : `<div style="font-family:'Playfair Display',serif;font-style:italic;color:var(--muted);text-align:center;padding:1rem;font-size:1rem;line-height:1.5">${escHtml(book.title)}</div>`;

  document.getElementById('detailBody').innerHTML = `
    <div class="book-detail-layout">
      <div class="book-detail-cover">${coverHTML}</div>
      <div class="book-detail-meta">
        <h2>${escHtml(book.title)}</h2>
        <div class="author">${escHtml(book.author||'Unknown author')}</div>
        <div class="meta-row">
          <div class="meta-pill"><span>📂</span><strong>${escHtml(book.category||'Uncategorised')}</strong></div>
          <div class="meta-pill"><span class="status-badge ${statusClass(book.status)}">${book.status}</span></div>
        </div>
        <div class="meta-row">
          <div class="meta-pill">📄 <strong>${book.currentPage||0}</strong> / ${book.totalPages||'?'} pages</div>
          <div class="meta-pill">📊 <strong>${p}%</strong> complete</div>
          <div class="meta-pill">📝 <strong>${(book.notes||[]).length}</strong> notes</div>
        </div>
        <div style="margin-top:0.8rem">
          <div class="progress-bar-bg" style="height:6px"><div class="progress-bar-fill" style="width:${p}%"></div></div>
        </div>
        <div style="margin-top:1rem;display:flex;gap:0.6rem;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="openNoteModal()">+ Add Note</button>
          <button class="btn btn-sm" onclick="openSupportModal()">+ Support Book</button>
        </div>
      </div>
    </div>

    <div class="detail-tabs">
      <button class="detail-tab ${activeDetailTab==='notes'?'active':''}" onclick="switchDetailTab('notes')">Reading Notes (${(book.notes||[]).length})</button>
      <button class="detail-tab ${activeDetailTab==='supports'?'active':''}" onclick="switchDetailTab('supports')">Supporting Shelf (${(book.supports||[]).length})</button>
    </div>
    <div id="detailTabContent"></div>
  `;
  renderDetailTab();
}

function switchDetailTab(tab) {
  activeDetailTab = tab;
  document.querySelectorAll('.detail-tab').forEach(t=>t.classList.toggle('active', t.textContent.startsWith(tab==='notes'?'Reading':'Supporting')));
  renderDetailTab();
}

function renderDetailTab() {
  const book = state.books.find(b=>b.id===currentBookId);
  const cont = document.getElementById('detailTabContent');
  if(!cont) return;
  if(activeDetailTab==='notes') {
    const notes = [...(book.notes||[])].sort((a,z)=>z.date.localeCompare(a.date));
    cont.innerHTML = notes.length ? notes.map((n,i)=>`
      <div class="note-entry">
        <div class="note-header">
          <span class="note-date">📅 ${n.date}</span>
          <div style="display:flex;align-items:center;gap:0.6rem">
            ${n.pages?`<span class="note-pages">pp. ${escHtml(n.pages)}</span>`:''}
            <button class="btn btn-sm" onclick="openEditNote('${n.id}')">Edit</button>
            <button class="btn btn-sm" style="color:var(--rust);border-color:var(--rust)" onclick="deleteNote('${n.id}')">Delete</button>
          </div>
        </div>
        <div class="note-body">${formatNote(n)}</div>
        ${(n.tags||[]).length?`<div class="note-tags">${n.tags.map(t=>`<span class="concept-tag">${escHtml(t)}</span>`).join('')}</div>`:''}
      </div>`).join('')
    : `<div class="empty-state"><div class="big">✍️</div><p>No notes yet for this book.</p><button class="btn btn-primary" onclick="openNoteModal()">Add Your First Note</button></div>`;
  } else {
    const sup = book.supports||[];
    cont.innerHTML = `
      <div class="support-shelf" id="supportShelf">
        ${sup.map((s,i)=>`<div class="support-book">📗 ${escHtml(s)}<button onclick="removeSupport(${i})">✕</button></div>`).join('')}
        ${!sup.length?'<p style="color:var(--muted);font-size:0.85rem">No supporting books yet.</p>':''}
      </div>
    `;
  }
}

function formatNote(n) {
  // notes now store HTML per field; legacy notes stored plain text
  const field = (val) => val ? `<div style="margin-bottom:0.6rem">${val}</div>` : '';
  let out = '';
  if(n.ideas)     out += `<div style="font-size:0.72rem;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--sienna);margin-bottom:0.2rem">💡 Key Ideas</div>${field(n.ideas)}`;
  if(n.questions) out += `<div style="font-size:0.72rem;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--slate);margin-bottom:0.2rem;margin-top:0.4rem">❓ Questions</div>${field(n.questions)}`;
  if(n.actions)   out += `<div style="font-size:0.72rem;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--sage);margin-bottom:0.2rem;margin-top:0.4rem">⚡ Actions</div>${field(n.actions)}`;
  return out || '<span style="color:var(--muted);font-size:0.85rem">No content.</span>';
}

function deleteNote(noteId) {
  if(!confirm('Delete this note?')) return;
  const book = state.books.find(b=>b.id===currentBookId);
  book.notes = book.notes.filter(n=>n.id!==noteId);
  save();
  renderDetailTab();
}

// ─── RICH EDITOR ─────────────────────────────────────────
let lastFocusedEditor = null;

document.addEventListener('focusin', e => {
  if(e.target.classList.contains('rich-editor')) lastFocusedEditor = e.target;
});

function fmt(cmd) {
  if(lastFocusedEditor) lastFocusedEditor.focus();
  document.execCommand(cmd, false, null);
  updateToolbarState();
}

function fmtHighlight() {
  if(lastFocusedEditor) lastFocusedEditor.focus();
  // toggle: if selection is inside a mark, remove; otherwise wrap
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const parent = sel.anchorNode?.parentElement;
  if(parent && parent.tagName==='MARK') {
    // unwrap
    const mark = parent;
    const frag = document.createDocumentFragment();
    while(mark.firstChild) frag.appendChild(mark.firstChild);
    mark.parentNode.replaceChild(frag, mark);
  } else {
    const mark = document.createElement('mark');
    try { range.surroundContents(mark); } catch(e) {
      mark.appendChild(range.extractContents());
      range.insertNode(mark);
    }
    sel.removeAllRanges();
  }
  updateToolbarState();
}

function updateToolbarState() {
  ['bold','italic','underline'].forEach(cmd => {
    const btn = document.querySelector(`.tb-btn[title="${cmd.charAt(0).toUpperCase()+cmd.slice(1)}"]`);
    if(btn) btn.classList.toggle('active', document.queryCommandState(cmd));
  });
}

document.addEventListener('selectionchange', updateToolbarState);

// ─── NOTE MODAL ──────────────────────────────────────────
let editingNoteId = null;

function openNoteModal() {
  editingNoteId = null;
  pendingTags = [];
  document.getElementById('noteModalTitle').textContent = 'Add Reading Note';
  document.getElementById('saveNoteBtn').textContent = 'Save Note';
  document.getElementById('note-date').value = today();
  document.getElementById('note-pages').value = '';
  document.getElementById('note-ideas').innerHTML = '';
  document.getElementById('note-questions').innerHTML = '';
  document.getElementById('note-actions').innerHTML = '';
  lastFocusedEditor = document.getElementById('note-ideas');
  renderTagInputWrap();
  openModal('noteModal');
}

function openEditNote(noteId) {
  const book = state.books.find(b=>b.id===currentBookId);
  const note = (book.notes||[]).find(n=>n.id===noteId);
  if(!note) return;
  editingNoteId = noteId;
  pendingTags = [...(note.tags||[])];
  document.getElementById('noteModalTitle').textContent = 'Edit Note';
  document.getElementById('saveNoteBtn').textContent = 'Save Changes';
  document.getElementById('note-date').value = note.date||today();
  document.getElementById('note-pages').value = note.pages||'';
  document.getElementById('note-ideas').innerHTML = note.ideas||'';
  document.getElementById('note-questions').innerHTML = note.questions||'';
  document.getElementById('note-actions').innerHTML = note.actions||'';
  lastFocusedEditor = document.getElementById('note-ideas');
  renderTagInputWrap();
  openModal('noteModal');
}

function renderTagInputWrap() {
  const wrap = document.getElementById('tagInputWrap');
  wrap.innerHTML = pendingTags.map((t,i)=>`<span class="inline-tag">${escHtml(t)}<button onclick="removeTag(${i})">✕</button></span>`).join('')
    + `<input type="text" id="tagInput" placeholder="${pendingTags.length?'add more…':'quorum sensing, biofilm…'}">`;
  const inp = document.getElementById('tagInput');
  inp.addEventListener('keydown', e => {
    if(e.key==='Enter'||e.key===',') {
      e.preventDefault();
      const val = inp.value.trim().replace(/,$/,'');
      if(val && !pendingTags.includes(val)) pendingTags.push(val);
      renderTagInputWrap();
    }
  });
}

function removeTag(i) { pendingTags.splice(i,1); renderTagInputWrap(); }

function saveNote() {
  const book = state.books.find(b=>b.id===currentBookId);
  if(!book) return;
  const tagInp = document.getElementById('tagInput');
  if(tagInp && tagInp.value.trim()) pendingTags.push(tagInp.value.trim());

  const noteData = {
    date: document.getElementById('note-date').value || today(),
    pages: document.getElementById('note-pages').value.trim(),
    ideas: document.getElementById('note-ideas').innerHTML.trim(),
    questions: document.getElementById('note-questions').innerHTML.trim(),
    actions: document.getElementById('note-actions').innerHTML.trim(),
    tags: [...pendingTags],
  };

  if(editingNoteId) {
    const idx = (book.notes||[]).findIndex(n=>n.id===editingNoteId);
    if(idx>-1) Object.assign(book.notes[idx], noteData);
  } else {
    if(!book.notes) book.notes = [];
    book.notes.push({ id: uid(), ...noteData });
  }
  save();
  closeModal('noteModal');
  renderDetailTab();
  renderDashboard();
}

// ─── SUPPORT BOOKS ───────────────────────────────────────
function openSupportModal() {
  const t = prompt('Enter a supporting book title:');
  if(!t) return;
  const book = state.books.find(b=>b.id===currentBookId);
  if(!book.supports) book.supports = [];
  book.supports.push(t.trim());
  save();
  renderDetailTab();
}

function removeSupport(i) {
  const book = state.books.find(b=>b.id===currentBookId);
  book.supports.splice(i,1);
  save();
  renderDetailTab();
}

// ─── IMPORT / EXPORT ─────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `learning-library-${today()}.json`;
  a.click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(!data.books) throw new Error('Invalid format');
      if(!confirm(`Import ${data.books.length} books? This will REPLACE current data.`)) return;
      state = data;
      save();
      renderDashboard();
      renderLibrary();
      alert('Import successful!');
    } catch(err) { alert('Invalid JSON file: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ─── MODAL HELPERS ───────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('open'); });
});

// ─── ESCAPE ──────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return String(s||'').replace(/'/g,"\\'"); }
